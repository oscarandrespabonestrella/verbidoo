name: 🐞 Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include children's real names or photos.
        A wrong conjugation or sentence? Use **Content correction** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Learning French (fr-CA), interface in Spanish
        2. Open Games → Time Travel
        3. ...
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPad, Safari 18, installed as app
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
